<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO & Meta Tags -->
    <title>CeTe by Nexxus | Gestión Logística Inteligente para MYPES</title>
    <meta name="description" content="CeTe, de Nexxus, centraliza inventario, facturación y ventas para PYMES y MYPES. Simplifica tu cadena de suministro con una plataforma B2B SaaS inteligente.">
    <meta name="keywords" content="gestión de inventario, facturación electrónica MYPES, ERP para restaurantes, software logística Perú, CeTe, Nexxus">
    <meta name="author" content="Nexxus (Salazar Marquina, Kevin et al.)">

    <!-- Fuentes Tipográficas Formales -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

    <style>
        /* CSS Variables: Tono B2B Corporativo */
        :root {
            --primary-blue: #0A2540;
            --accent-orange: #FF6A00;
            --secondary-blue: #204066;
            --light-bg: #F6F9FC;
            --text-dark: #32325D;
            --text-muted: #6B7C93;
            --white: #FFFFFF;
        }

        /* Reseteo y Estilos Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            color: var(--text-dark);
            background-color: var(--white);
            line-height: 1.6;
        }

        h1, h2, h3 {
            font-family: 'Montserrat', sans-serif;
            color: var(--primary-blue);
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Botones Globales */
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            text-align: center;
        }

        .btn-primary {
            background-color: var(--accent-orange);
            color: var(--white);
            box-shadow: 0 4px 6px rgba(255, 106, 0, 0.2);
        }

        .btn-primary:hover {
            background-color: #e65c00;
            transform: translateY(-2px);
        }

        .btn-outline {
            border: 2px solid var(--primary-blue);
            color: var(--primary-blue);
            background: transparent;
        }

        .btn-outline:hover {
            background-color: var(--primary-blue);
            color: var(--white);
        }
    </style>
</head>
<body>

</body>
</html>
